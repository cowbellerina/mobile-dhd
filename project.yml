name: DHD
options:
  bundleIdPrefix: com.cowbellerina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Signing (DEVELOPMENT_TEAM) comes from Config/Signing.local.xcconfig, which is gitignored.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0.0"
    # Continues from the Expo app: highest EAS-built iOS build number was 5 (1.1.0, 2026-03-10).
    CURRENT_PROJECT_VERSION: "6"

targets:
  DHD:
    type: application
    platform: iOS
    sources:
      - path: DHD
    settings:
      base:
        # Same bundle ID as the Expo app so this ships as an update to the existing App Store listing.
        PRODUCT_BUNDLE_IDENTIFIER: com.cowbellerina.mobile-dhd
        PRODUCT_NAME: DHD
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DHD
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

  DHDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DHDTests
    dependencies:
      - target: DHD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cowbellerina.mobile-dhd.tests
        GENERATE_INFOPLIST_FILE: YES

  DHDUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DHDUITests
    dependencies:
      - target: DHD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cowbellerina.mobile-dhd.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DHD

schemes:
  DHD:
    build:
      targets:
        DHD: all
        DHDTests: [test]
        DHDUITests: [test]
    test:
      targets:
        - DHDTests
        - DHDUITests
      gatherCoverageData: true
